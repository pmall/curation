# The workspace of Drakkar: database, the Drakkar database and everything around it, and
# curation, a client of the Drakkar database that curates it.
# Each member is a package of its own; the root only runs their tools together.

[tool.uv.workspace]
members = ["database", "curation"]

[tool.uv.sources]
database = { workspace = true }
curation = { workspace = true }

[dependency-groups]
dev = [
    "database",
    "curation",
    "lxml-stubs>=0.5.1",
    "mdformat>=1.0.0",
    "mdformat-frontmatter>=2.1.2",
    "mdformat-gfm>=1.0.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-openpyxl>=3.1.5.20260827",
    "xlwt>=1.3.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["database/src", "curation/src"]
extraPaths = ["database/src", "curation/src"]

[tool.pytest.ini_options]
testpaths = ["database/tests", "curation/tests"]
