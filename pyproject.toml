[project]
name = "curation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.88",
    "charset-normalizer>=3.5.2",
    "lxml>=6.1.3",
    "olefile>=0.47",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pymupdf>=1.28.2",
    "pyopal>=0.7.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "trafilatura>=2.3.1",
    "xlrd>=2.0.2",
]

[project.scripts]
drakkar-taxonomy = "drakkar.taxonomy:main"
drakkar-uniprot = "drakkar.uniprot:main"
drakkar-check = "drakkar.check:main"
drakkar-add = "drakkar.files:add_main"
drakkar-revise = "drakkar.files:revise_main"
drakkar-publications = "drakkar.files:publications_main"
drakkar-diff = "drakkar.files:diff_main"
drakkar-notes = "drakkar.files:notes_main"
drakkar-batch = "drakkar.files:batch_main"
drakkar-read = "drakkar.read:main"
drakkar-align = "drakkar.alignments:main"
drakkar-fetch = "drakkar.fetch:main"
drakkar-download = "drakkar.fetch:download_main"
drakkar-parse = "drakkar.parse:main"
drakkar-genbank = "drakkar.genbank:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "drakkar"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mdformat>=1.0.0",
    "mdformat-frontmatter>=2.1.2",
    "mdformat-gfm>=1.0.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-openpyxl>=3.1.5.20260827",
    "xlwt>=1.3.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
